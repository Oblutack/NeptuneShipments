services:
  db:
    build: ./backend/db # <--- CHANGED: Build from our custom file
    container_name: neptune_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neptune_shipments
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: neptune_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@neptune.com
      PGADMIN_DEFAULT_PASSWORD: password123
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build: ./backend
    container_name: neptune_api
    restart: always
    environment:
      ENVIRONMENT: production
      DB_URL: postgres://postgres:password123@db:5432/neptune_shipments?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see README}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set - see README}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_AIS_TRACKER_URL: ${VITE_AIS_TRACKER_URL:-}
        # Defaults to localhost:8080, correct for this compose file's own
        # port mapping (the browser reaches the API on the host, not over
        # the internal docker network) - override when deploying anywhere
        # else, since this is baked in at image build time, not read at
        # container start.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: neptune_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
