name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Repository tests hit a real Postgres+PostGIS+pgRouting instance
      # rather than a mock - the project's custom image (backend/db/Dockerfile)
      # isn't on a public registry, so it's built here the same way
      # docker-compose builds it, instead of using `services:` (which only
      # pulls pre-built images).
      - name: Build test database image
        run: docker build -t neptune_test_db ./db

      - name: Start test database
        run: |
          docker run -d --name neptune_test_db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=neptune_test \
            neptune_test_db
          for i in $(seq 1 30); do
            if docker exec neptune_test_db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path db/migrations -database "postgres://postgres:postgres@localhost:5432/neptune_test?sslmode=disable" up

      - name: go test
        run: go test ./...
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/neptune_test?sslmode=disable

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
